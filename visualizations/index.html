<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>算法一步一步看</title>
<style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#1b2936;background:#f3f7f8}body{max-width:960px;margin:auto;padding:24px}h1{margin-bottom:.3em}p{line-height:1.7}.tabs,.controls,.row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button{font:inherit;padding:9px 15px;border:1px solid #8ca2a8;border-radius:8px;background:white;cursor:pointer}button:hover,button[aria-pressed=true]{background:#166a6a;color:white;border-color:#166a6a}button:disabled{opacity:.5;cursor:not-allowed}section{background:#fff;border-radius:14px;padding:22px;box-shadow:0 4px 20px #1c42420d}.cell{width:67px;border:2px solid #bfd1d2;border-radius:9px;padding:10px 4px;text-align:center}.cell small{display:block;color:#52676a}.cell.active{background:#ffe69b;border-color:#cf9500}.cell.done{background:#c8ebdb;border-color:#31946f}.cell.excluded{opacity:.35}.status{padding:14px;background:#eef7f5;border-left:4px solid #168378;min-height:2em;line-height:1.6}.legend{color:#52676a;font-size:.9em}code{background:#eff4f5;padding:2px 4px}a{color:#086b77}.grid{display:grid;grid-template-columns:repeat(4,68px);gap:8px}.grid .cell{box-sizing:border-box;height:58px;width:68px}.wall{background:#46565a;color:white}.current{background:#ffe69b;border-color:#cf9500}.visited{background:#c8ebdb;border-color:#31946f}
</style>
</head>
<body>
<h1>算法一步一步看</h1><p>三个离线小实验：点击“下一步”，观察数据如何变化。建议先猜下一步，再点击验证。无需联网，输入示例固定。</p>
<div class="tabs" role="group" aria-label="选择算法"><button id="tab-prefix">前缀和</button><button id="tab-binary">二分查找</button><button id="tab-bfs">广度优先搜索</button></div>
<section><h2 id="title"></h2><p id="description"></p><div id="board"></div><p class="legend" id="legend"></p><div class="status" role="status" aria-live="polite" id="status"></div><div class="controls"><button id="next">下一步</button><button id="reset">重新开始</button></div><p id="related"></p></section>
<script>
'use strict';
const tabs=['prefix','binary','bfs']; let mode='prefix', step=0;
const $=id=>document.getElementById(id);
const data=[2,-3,5,7], sums=[0,2,-1,4,11];
const sorted=[1,3,5,7,9,11,13], target=13;
let low,high,done,queue,dist,current;
const grid=['....','.#..','....'];
function init(){step=0;low=0;high=sorted.length-1;done=false;queue=[[0,0]];dist=grid.map(r=>Array(r.length).fill(-1));dist[0][0]=0;current=null;render();}
function cell(value,sub,cls=''){const div=document.createElement('div');div.className='cell '+cls;const strong=document.createElement('strong');strong.textContent=value;const small=document.createElement('small');small.textContent=sub;div.append(strong,small);return div;}
function render(){
 for(const t of tabs) $('tab-'+t).setAttribute('aria-pressed',String(t===mode));
 const board=$('board');board.replaceChildren();$('next').disabled=done;
 if(mode==='prefix'){
  $('title').textContent='前缀和：把重复求和变成减法';$('description').textContent='数组 a = [2, -3, 5, 7]。依次算前 i 项之和，最后求第 2 项到第 4 项的和。';
  const row=document.createElement('div');row.className='row';
  for(let i=0;i<sums.length;i++)row.appendChild(cell(i<=step?sums[i]:'?',`s[${i}]`,i===step?'active':i<step?'done':''));board.appendChild(row);
  $('legend').textContent='黄色：刚算到的位置；绿色：之前算好的前缀。s[0] 是空前缀。';
  $('status').textContent=step===0?'s[0] = 0。先算 s[1]。':step<=4?`s[${step}] = s[${step-1}] + a[${step}] = ${sums[step-1]} + (${data[step-1]}) = ${sums[step]}。`:'区间 [2,4] = s[4] − s[1] = 11 − 2 = 9。';
  $('related').innerHTML='对应练习：<a href="../projects/02-range/prefix.md">静态区间报表</a>。';
 }else if(mode==='binary'){
  $('title').textContent='二分查找：缩小候选区间';$('description').textContent='在升序数组中寻找 13。每次比较中间值，排除不可能的一半；区间包含左右端点。';
  const row=document.createElement('div');row.className='row';const mid=low<=high?Math.floor((low+high)/2):-1;
  sorted.forEach((x,i)=>row.appendChild(cell(x,`下标 ${i}`,i===mid&&!done?'active':i<low||i>high?'excluded':done&&x===target?'done':'')));board.appendChild(row);
  $('legend').textContent='黄色：当前比较位置；淡色：已经排除的候选。';
  $('status').textContent=done?(low<=high?`找到 ${target}，下标 ${low}。`:'区间为空，未找到。'):`候选下标 [${low}, ${high}]；中间下标 ${mid}，值为 ${sorted[mid]}。点击下一步进行比较。`;
  $('related').innerHTML='扩展阅读：<a href="../docs/algorithm-thinking.md">从约束出发设计算法</a>；<a href="../projects/03-decisions/capacity.md">二分答案练习</a>。';
 }else{
  $('title').textContent='BFS：像水波一样扩展';$('description').textContent='从左上角出发，上下左右每步距离为 1，# 是墙。数字表示首次到达该格的最少步数。';
  const box=document.createElement('div');box.className='grid';
  grid.forEach((r,x)=>[...r].forEach((ch,y)=>{const active=current&&current[0]===x&&current[1]===y;box.appendChild(cell(ch==='#'?'#':dist[x][y]===-1?'·':dist[x][y],`${x},${y}`,ch==='#'?'wall':active?'current':dist[x][y]>=0?'visited':''));}));board.appendChild(box);
  $('legend').textContent='黄色：刚出队的格子；绿色：已发现。坐标从 0 开始。';
  const formatted=queue.map(([x,y])=>`(${x},${y})`).join(' → ')||'空';
  $('status').textContent=(done?'队列为空，搜索结束。':current?`刚扩展 (${current[0]},${current[1]})，首次发现的邻居已入队。`:'起点入队，距离为 0。')+` 当前队列：${formatted}。`;
  $('related').innerHTML='对应练习：<a href="../projects/04-search/maze.md">迷宫导航器</a>。';
 }
}
function next(){
 if(done)return;
 if(mode==='prefix'){step++;if(step===5)done=true;}
 else if(mode==='binary'){let mid=Math.floor((low+high)/2);if(sorted[mid]===target){low=high=mid;done=true;}else if(sorted[mid]<target)low=mid+1;else high=mid-1;if(low>high)done=true;}
 else{current=queue.shift();let [x,y]=current;for(const [dx,dy] of [[1,0],[0,-1],[0,1],[-1,0]]){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<grid.length&&ny>=0&&ny<grid[0].length&&grid[nx][ny]!== '#'&&dist[nx][ny]===-1){dist[nx][ny]=dist[x][y]+1;queue.push([nx,ny]);}}if(queue.length===0)done=true;}
 render();
}
for(const t of tabs) $('tab-'+t).addEventListener('click',()=>{mode=t;init();});$('next').addEventListener('click',next);$('reset').addEventListener('click',init);init();
</script></body></html>
